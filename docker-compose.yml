name: p4-integrated-backend

services:
  db:
    image: postgis/postgis:17-3.5
    container_name: vehicle-platform-postgis
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-vehicle_platform}
    volumes:
      - p4_pgdata:/var/lib/postgresql/data
    networks: [p4]

  node-migrate:
    build:
      context: .
      dockerfile: docker/node.Dockerfile
      target: runtime
      ssh: [default]
    container_name: vehicle-platform-node-migrate
    restart: "no"
    depends_on:
      - db
    env_file:
      - .runtime/compose.env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-vehicle_platform}?schema=public
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt/private.pem
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt/public.pem
    command:
      - /bin/sh
      - -c
      - >-
        until npx prisma migrate deploy; do
          echo 'Waiting for PostgreSQL/migrations...'; sleep 2;
        done && npx tsx prisma/seed.ts
    volumes:
      - ./secrets/jwt:/run/secrets/jwt:ro
    networks: [p4]

  node:
    build:
      context: .
      dockerfile: docker/node.Dockerfile
      target: runtime
      ssh: [default]
    container_name: vehicle-platform-node
    restart: unless-stopped
    depends_on:
      node-migrate:
        condition: service_completed_successfully
    env_file:
      - .runtime/compose.env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      HOST: 0.0.0.0
      PORT: "3000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-vehicle_platform}?schema=public
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt/private.pem
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt/public.pem
      ROUTING_TRACKING_BASE_URL: http://routing:8000
      VISION_PUBLIC_BASE_URL: ${VISION_PUBLIC_BASE_URL:-https://${TLS_PUBLIC_ADDRESS:-10.174.96.119}:39002}
      LIVE_VIEW_URL: ${LIVE_VIEW_URL:-https://${TLS_PUBLIC_ADDRESS:-10.174.96.119}:39002/}
      MINIO_ENDPOINT: minio:9000
      MINIO_USE_SSL: "false"
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-https://${TLS_PUBLIC_ADDRESS:-10.174.96.119}:39003}
      RECORDING_ENABLED: ${RECORDING_ENABLED:-false}
      ANDROID_TELEMETRY_ENABLED: ${ANDROID_TELEMETRY_ENABLED:-false}
    volumes:
      - ./secrets/jwt:/run/secrets/jwt:ro
    expose: ["3000"]
    networks: [p4]

  routing:
    build:
      context: ./services/routing-tracking
      dockerfile: ../../docker/routing.Dockerfile
    container_name: vehicle-platform-routing
    restart: unless-stopped
    env_file:
      - .runtime/compose.env
    environment:
      ROUTING_TRACKING_SERVICE_TOKEN: ${ROUTING_TRACKING_SERVICE_TOKEN:-}
      MEDIA_RELAY_INTERNAL_BASE_URL: http://relay:39012
      PBF_PATH: /app/routing/busan-roads_osm.pbf
      BUSAN_BUS_HISTORY_PATH: /app/routing/data/busan_bus_gps.csv
      BUSAN_BUS_HYBRID_PATH: /app/routing/data/busan_bus_hybrid.csv
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    expose: ["8000"]
    networks: [p4]

  relay:
    build:
      context: ./services/media-relay
      dockerfile: ../../docker/relay.Dockerfile
    container_name: vehicle-platform-relay
    restart: unless-stopped
    env_file:
      - .runtime/compose.env
    environment:
      RELAY_LISTEN_ADDR: 0.0.0.0:39012
      TURN_URL: ${TURN_URL:-turn:${TLS_PUBLIC_ADDRESS:-10.174.96.119}:39004?transport=udp}
      YOLO_FEED_SOCKET: /run/p4/relay/yolo.sock
      PY_ANDROID_LIVE_URL: http://vision:39011/internal/android-live
      PY_TELEMETRY_URL: http://vision:39011/internal/telemetry
      NODE_INTERNAL_BASE_URL: http://node:3000
      MINIO_ENDPOINT: minio:9000
      MINIO_USE_SSL: "false"
      RECORDING_SPOOL_DIR: /var/tmp/p4-recordings
    volumes:
      - p4_relay_feed:/run/p4/relay
      - p4_recording_spool:/var/tmp/p4-recordings
    expose: ["39012"]
    networks: [p4]

  vision:
    build:
      context: ./services/vision
      dockerfile: ../../docker/vision.Dockerfile
      additional_contexts:
        ultralytics: ${VISION_ULTRALYTICS_CONTEXT:-./services/vision/.ultralytics-custom}
    container_name: vehicle-platform-vision
    restart: unless-stopped
    env_file:
      - .runtime/compose.env
    environment:
      HOST: 0.0.0.0
      PORT: "39011"
      YOLO_MODEL: ${YOLO_MODEL_CONTAINER:-/models/a4_best.engine}
      YOLO_DEVICE: ${YOLO_DEVICE_CONTAINER:-cuda:0}
      YOLO_FEED_SOCKET: /run/p4/relay/yolo.sock
      RELAY_KEYFRAME_URL: http://relay:39012/internal/request-keyframe
      RELAY_STATUS_URL: http://relay:39012/internal/status
      NODE_INTERNAL_BASE_URL: http://node:3000
      TURN_URL: ${TURN_URL:-turn:${TLS_PUBLIC_ADDRESS:-10.174.96.119}:39004?transport=udp}
      RECORDING_ENABLED: ${RECORDING_ENABLED:-false}
      LIVE_VIEW_PARENT_ORIGINS: ${LIVE_VIEW_PARENT_ORIGINS:-https://${TLS_PUBLIC_ADDRESS:-10.174.96.119}:39001}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["3"]
              capabilities: [gpu]
    gpus:
      - driver: nvidia
        device_ids: ["3"]
        capabilities: [gpu]
    volumes:
      - p4_relay_feed:/run/p4/relay
      - ${VISION_MODEL_HOST_PATH:-./services/vision/models}:/models:ro
    expose: ["39011"]
    networks: [p4]

  nginx:
    image: nginx:1.27-alpine
    container_name: vehicle-platform-nginx
    restart: unless-stopped
    depends_on:
      - node
      - routing
      - relay
      - vision
    ports:
      - "${PUBLIC_OPERATOR_PORT:-39001}:39001"
      - "${PUBLIC_VISION_PORT:-39002}:39002"
    expose: ["39001", "39002", "39003"]
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./secrets/tls:/etc/nginx/tls:ro
      - p4_nginx_logs:/var/log/nginx
    networks: [p4]

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: vehicle-platform-minio
    profiles: [recording]
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-p4-minio-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-development-password-change-me}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL:-http://127.0.0.1:9001}
    expose: ["9000", "9001"]
    volumes:
      - p4_minio_data:/data
    networks: [p4]

  minio-bootstrap:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: vehicle-platform-minio-bootstrap
    profiles: [recording]
    restart: "no"
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "/bootstrap.sh"]
    env_file:
      - .runtime/compose.env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-p4-minio-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-development-password-change-me}
      MINIO_RECORDING_BUCKET: ${MINIO_RECORDING_BUCKET:-p4-trip-recordings}
      MINIO_RELAY_ACCESS_KEY: ${MINIO_ACCESS_KEY:-p4-relay}
      MINIO_RELAY_SECRET_KEY: ${MINIO_SECRET_KEY:-replace-relay-secret}
      MINIO_NODE_ACCESS_KEY: ${MINIO_NODE_ACCESS_KEY:-p4-node}
      MINIO_NODE_SECRET_KEY: ${MINIO_NODE_SECRET_KEY:-replace-node-secret}
    volumes:
      - ./deploy/minio/bootstrap.sh:/bootstrap.sh:ro
      - ./deploy/minio/policies:/policies:ro
    networks: [p4]

  coturn:
    image: coturn/coturn:4.6.3
    container_name: vehicle-platform-coturn
    restart: unless-stopped
    network_mode: host
    env_file:
      - .runtime/compose.env
    command:
      - -n
      - --log-file=stdout
      - --fingerprint
      - --lt-cred-mech
      - --no-cli
      - --realm=${TURN_REALM:-p4.local}
      - --user=${TURN_USERNAME:-user}:${TURN_PASSWORD:-replace-with-strong-turn-password}
      - --listening-port=39004
      - --tls-listening-port=39005
      - --min-port=39006
      - --max-port=39007
      - --listening-ip=${TURN_LISTENING_IP:-0.0.0.0}
      - --relay-ip=${TURN_RELAY_IP:-10.174.96.119}
      - --external-ip=${TURN_EXTERNAL_IP:-10.174.96.119}

networks:
  p4:
    name: p4-internal

volumes:
  p4_pgdata:
  p4_minio_data:
  p4_relay_feed:
  p4_recording_spool:
  p4_nginx_logs:
