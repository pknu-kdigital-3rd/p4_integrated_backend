services:
  db:
    image: postgis/postgis:17-3.5
    container_name: vehicle-platform-postgis
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: vehicle_platform
    ports:
      - "5432:5432"
    volumes:
      - p4_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U app -d vehicle_platform" ]
      interval: 5s
      timeout: 5s
      retries: 10

  backup:
    image: postgres:17-alpine
    container_name: vehicle-platform-backup
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: app
    volumes:
      - ../postgres_backups:/backups
    entrypoint: >
      sh -c "echo '0 3 * * * pg_dump -h db -U app vehicle_platform > /backups/backup_$$(date +\%Y\%m\%d).sql find /backups -name \"backup_*.sql\" -mtime +14 -delete' | crontab - && crond -f"

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: vehicle-platform-minio
    profiles: ["recording"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-p4-minio-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-development-password-change-me}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - p4_minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/ready >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-bootstrap:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: vehicle-platform-minio-bootstrap
    profiles: ["recording"]
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/bootstrap.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-p4-minio-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-development-password-change-me}
      MINIO_RECORDING_BUCKET: ${MINIO_RECORDING_BUCKET:-p4-trip-recordings}
      MINIO_RELAY_ACCESS_KEY: ${MINIO_ACCESS_KEY:-p4-relay}
      MINIO_RELAY_SECRET_KEY: ${MINIO_SECRET_KEY:-replace-relay-secret}
      MINIO_NODE_ACCESS_KEY: ${MINIO_NODE_ACCESS_KEY:-p4-node}
      MINIO_NODE_SECRET_KEY: ${MINIO_NODE_SECRET_KEY:-replace-node-secret}
    volumes:
      - ./deploy/minio/bootstrap.sh:/bootstrap.sh:ro
      - ./deploy/minio/policies:/policies:ro

volumes:
  p4_pgdata:
  p4_minio_data:

