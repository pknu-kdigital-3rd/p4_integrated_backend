services:
  node:
    environment:
      NODE_ENV: development
    command: ["./node_modules/.bin/tsx", "watch", "src/server.ts"]
    working_dir: /workspace/node
    volumes:
      - ./node:/workspace/node
      - type: bind
        source: ../p4_integrated_backend_data/node_modules
        target: /workspace/node/node_modules
      - ./operator-web:/workspace/operator-web

  node-migrate:
    volumes:
      - ./node:/workspace/node
      - type: bind
        source: ../p4_integrated_backend_data/node_modules
        target: /workspace/node/node_modules

  routing:
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/workspace/services/routing-tracking"]
    volumes:
      - ./services/routing-tracking:/workspace/services/routing-tracking

  vision:
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "39011", "--reload", "--reload-dir", "/workspace/services/vision"]
    volumes:
      - ./services/vision:/workspace/services/vision
      - ./services/vision/.ultralytics-custom:/workspace/services/vision/.ultralytics-custom:ro
      - ./services/vision/models:/workspace/services/vision/models:ro
