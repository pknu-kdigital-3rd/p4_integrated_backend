worker_processes 1;
pid logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    default_type application/octet-stream;
    client_body_temp_path logs/client_temp;
    proxy_temp_path logs/proxy_temp;
    fastcgi_temp_path logs/fastcgi_temp;
    uwsgi_temp_path logs/uwsgi_temp;
    scgi_temp_path logs/scgi_temp;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    log_format its '$remote_addr - $host [$time_local] "$request" $status '
                   'upstream=$upstream_addr forwarded_proto=$http_x_forwarded_proto';
    access_log logs/its-access.log its;
    error_log logs/its-error.log warn;

    server {
        listen 39001 ssl;
        server_name 10.174.96.119;

        ssl_certificate ../../secrets/tls/server.crt;
        ssl_certificate_key ../../secrets/tls/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:ITS_TLS:10m;
        ssl_session_timeout 1d;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Permissions-Policy "camera=(self), microphone=(self), fullscreen=(self)" always;

        # Keep tile requests same-origin for clients whose network policy
        # blocks direct browser requests to public OSM tile hosts.
        location ^~ /osm/ {
            proxy_pass https://tile.openstreetmap.org/;
            proxy_ssl_server_name on;
            proxy_ssl_name tile.openstreetmap.org;
            proxy_set_header Host tile.openstreetmap.org;
            proxy_set_header User-Agent "P4 ITS operator map/1.0";
            proxy_cache_valid 200 1h;
        }

        # Node API and operator dashboard.
        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    server {
        listen 39002 ssl;
        server_name 10.174.96.119;

        ssl_certificate ../../secrets/tls/server.crt;
        ssl_certificate_key ../../secrets/tls/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:ITS_TLS:10m;
        ssl_session_timeout 1d;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Permissions-Policy "camera=(self), microphone=(self), fullscreen=(self)" always;

        # Vision owns the root of its browser-facing HTTPS origin.
        location / {
            proxy_pass http://127.0.0.1:39011/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 300s;
        }

        # Vision page constructs this origin-relative WebSocket URL.
        location = /ws/playback {
            proxy_pass http://127.0.0.1:39011/ws/playback;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Android WebRTC signaling; relay internals remain loopback-only.
        location = /offer/android {
            proxy_pass http://127.0.0.1:39012/offer/android;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            client_max_body_size 1m;
        }

        location = /health/vision {
            proxy_pass http://127.0.0.1:39011/health/live;
        }

        location = /health/relay {
            proxy_pass http://127.0.0.1:39012/healthz;
        }
    }

    # Private MinIO S3 API ingress. Preserve the public Host header because
    # presigned SigV4 URLs include it.
    server {
        listen 39003 ssl;
        server_name 10.174.96.119;

        ssl_certificate ../../secrets/tls/server.crt;
        ssl_certificate_key ../../secrets/tls/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:ITS_TLS:10m;
        ssl_session_timeout 1d;

        add_header X-Content-Type-Options nosniff always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range, Content-Type, Authorization" always;
        add_header Access-Control-Expose-Headers "ETag, Content-Length, Content-Range, Accept-Ranges" always;

        location / {
            if ($request_method = OPTIONS) { return 204; }
            proxy_pass http://127.0.0.1:9000;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
        }
    }

    # MinIO Console HTTPS ingress. The container's 9001 listener remains
    # loopback-bound; only this TLS proxy is reachable from the LAN.
    server {
        listen 39004 ssl;
        server_name 10.174.96.119;

        ssl_certificate ../../secrets/tls/server.crt;
        ssl_certificate_key ../../secrets/tls/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:ITS_TLS:10m;
        ssl_session_timeout 1d;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;

        location / {
            proxy_pass http://127.0.0.1:9001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
