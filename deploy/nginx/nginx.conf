worker_processes 1;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    default_type application/octet-stream;
    resolver 127.0.0.11 valid=30s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    log_format its '$remote_addr - $host [$time_local] "$request" $status '
                   'upstream=$upstream_addr forwarded_proto=$http_x_forwarded_proto';
    access_log /var/log/nginx/its-access.log its;
    error_log /var/log/nginx/its-error.log warn;

    server {
        listen 39001 ssl;
        server_name _;

        ssl_certificate /etc/nginx/tls/server.crt;
        ssl_certificate_key /etc/nginx/tls/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:ITS_TLS:10m;
        ssl_session_timeout 1d;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Permissions-Policy "camera=(self), microphone=(self), fullscreen=(self)" always;

        location ^~ /osm/ {
            proxy_pass https://tile.openstreetmap.org/;
            proxy_ssl_server_name on;
            proxy_ssl_name tile.openstreetmap.org;
            proxy_set_header Host tile.openstreetmap.org;
            proxy_set_header User-Agent "P4 ITS operator map/1.0";
            proxy_cache_valid 200 1h;
        }

        location / {
            proxy_pass http://p4-node:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    server {
        listen 39002 ssl;
        server_name _;

        ssl_certificate /etc/nginx/tls/server.crt;
        ssl_certificate_key /etc/nginx/tls/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:ITS_TLS:10m;
        ssl_session_timeout 1d;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header Permissions-Policy "camera=(self), microphone=(self), fullscreen=(self)" always;

        location / {
            proxy_pass http://p4-vision:39011/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 300s;
        }

        location = /ws/playback {
            proxy_pass http://p4-vision:39011/ws/playback;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location = /offer/android {
            proxy_pass http://p4-relay:39012/offer/android;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            client_max_body_size 1m;
        }

        location = /health/vision {
            proxy_pass http://p4-vision:39011/health/live;
        }

        location = /health/relay {
            proxy_pass http://p4-relay:39012/healthz;
        }
    }

    # Replay uses direct MinIO S3 presigned URLs.
    server {
        listen 39003 ssl;
        server_name _;

        ssl_certificate /etc/nginx/tls/server.crt;
        ssl_certificate_key /etc/nginx/tls/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:ITS_TLS:10m;
        ssl_session_timeout 1d;

        add_header X-Content-Type-Options nosniff always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range, Content-Type, Authorization" always;
        add_header Access-Control-Expose-Headers "ETag, Content-Length, Content-Range, Accept-Ranges" always;

        location / {
            if ($request_method = OPTIONS) { return 204; }
            set $minio_api_upstream p4-minio:9000;
            proxy_pass http://$minio_api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
        }
    }
}
