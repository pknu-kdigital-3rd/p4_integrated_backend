[project]
name = "poc-server-webrtc"
version = "0.1.0"
description = "WebRTC relay server with YOLO object detection"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiortc",
    "fastapi[standard]",
    "httpx",
    "lap>=0.5.12",
    "openai",
    "opencv-python-headless",
    "psutil",
    "pydantic-settings",
    "tensorrt-cu13",
    "torch",
    "torchvision",
    "ultralytics",
    "unidepth @ git+https://github.com/lpiccinelli-eth/UniDepth.git@8d8cfe4c7ee15297099983607febf0d4f32eb3d6",
]

# Ultralytics currently declares the GUI-enabled opencv-python package on
# Linux. The server and offline tools only need cv2's non-GUI APIs, so keep the
# project-level opencv-python-headless dependency and remove that transitive
# GUI package from Ultralytics' dependency graph.
[tool.uv]
exclude-dependencies = [
    "opencv-python",
]

# Pull torch/torchvision from PyTorch's CUDA wheel index instead of the default
# CPU-only PyPI build, so YOLO inference uses the GPU when one is available.
[tool.uv.sources]
# The trained checkpoint serializes custom classes from this fork. Each host
# links its checkout here so the project and lockfile use the same path on
# Windows and Linux.
ultralytics = { path = ".ultralytics-custom", editable = true }
torch = [{ index = "pytorch-cu130" }]
torchvision = [{ index = "pytorch-cu130" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

