[project]
name = "poc-server-webrtc"
version = "0.1.0"
description = "WebRTC relay server with configurable segmentation inference"
requires-python = ">=3.12"
dependencies = [
    "aiortc",
    "einops",
    "fastapi[standard]",
    "openai",
    "opencv-python-headless",
    "pycocotools",
    "pydantic-settings",
    # SAM3 currently imports the legacy pkg_resources module. setuptools 81+
    # removed it, so keep a compatible release in the Vision environment.
    "setuptools<81",
    "torch",
    "torchvision",
]

# The server only needs cv2's non-GUI APIs, so keep the headless OpenCV wheel.

# Pull torch/torchvision from PyTorch's CUDA wheel index instead of the default
# CPU-only PyPI build, so SAM3 inference uses the GPU when one is available.
[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]
torchvision = [{ index = "pytorch-cu130" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

