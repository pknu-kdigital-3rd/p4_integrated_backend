# Layer over docker-compose.prod.yml to reload Routing source from the checkout.
# Production environment, network, and persistent routing state are inherited.
# Python dependencies remain in the image; rebuild when pyproject.toml/uv.lock change.
services:
  p4-routing:
    working_dir: /workspace/services/routing-tracking
    command:
      - uvicorn
      - main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /workspace/services/routing-tracking
    volumes:
      - type: bind
        source: ./services/routing-tracking
        target: /workspace/services/routing-tracking
